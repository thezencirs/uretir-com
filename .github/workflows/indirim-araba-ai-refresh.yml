name: IndirimAI ArabaAI and EvAI source refresh

on:
  schedule:
    - cron: "47 */6 * * *"
    - cron: "23 */4 * * *"
    - cron: "07 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commerce-auto-ai-refresh
  cancel-in-progress: false

jobs:
  indirim:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh trusted commerce prices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://www.uretir.com
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --max-time 70 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/indirim-ai"

  araba:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 */4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh official vehicle prices and campaigns
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://www.uretir.com
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --max-time 70 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/araba-ai"

  evai:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '07 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh property listings
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://www.uretir.com
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --max-time 70 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/ev-ai"
