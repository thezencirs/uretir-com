name: PuanAI source maintenance

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/puanai-maintenance.yml"

concurrency:
  group: puanai-source-maintenance
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.PUANAI_DATABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SITE_URL: https://www.uretir.com
    steps:
      - name: Run through database when configured
        if: env.DATABASE_URL != ''
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: env.DATABASE_URL != ''
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: pnpm

      - if: env.DATABASE_URL != ''
        run: pnpm install --frozen-lockfile

      - if: env.DATABASE_URL != ''
        run: pnpm db:migrate

      - if: env.DATABASE_URL != ''
        run: pnpm puanai:automation

      - name: Run production fallback
        if: env.DATABASE_URL == ''
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --max-time 70 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/puanai-refresh/02"
