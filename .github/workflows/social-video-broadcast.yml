name: "Üretir 7/24 Telegram Stok & Veri Otomasyonu (09:00-11:00-13:00-15:00-18:00-20:00)"

on:
  schedule:
    # 09:00 TSİ (06:00 UTC) - HaberAI
    - cron: "0 6 * * *"
    # 11:00 TSİ (08:00 UTC) - PuanAI
    - cron: "0 8 * * *"
    # 13:00 TSİ (10:00 UTC) - İndirimAI
    - cron: "0 10 * * *"
    # 15:00 TSİ (12:00 UTC) - FinansAI
    - cron: "0 12 * * *"
    # 18:00 TSİ (15:00 UTC) - EvAI
    - cron: "0 15 * * *"
    # 20:00 TSİ (17:00 UTC) - ArabaAI
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Kategori (all, haberai, puanai, indirimai, finansai, evai, arabaai)"
        required: false
        default: "all"
      mode:
        description: "Çalışma modu (publish: Telegram'a gönder, render-only: sadece MP4/kapak üret)"
        required: false
        default: "publish"

permissions:
  contents: read

concurrency:
  group: uretir-social-video-broadcast
  cancel-in-progress: false

jobs:
  uretir-broadcast:
    name: "uretir.com Veri Senkronizasyonu + %100 İhlal Yoktur Video + Telegram (@uretirbot) Stok"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup uv & Python 3.11 for Piper Neural Turkish TTS
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache Piper Turkish Male Voice Model (.local/voices)
        uses: actions/cache@v4
        with:
          path: .local/voices
          key: uretir-piper-tr-fahrettin-v1

      - name: Install FFmpeg, Piper TTS & Node dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          uv python install 3.11
          pnpm install --frozen-lockfile

      - name: Run Üretir Data Sync & Telegram (@uretirbot) Stock Broadcast
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://www.uretir.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '995164733' }}
          SKIP_PUBLISH: ${{ github.event.inputs.mode == 'render-only' && '1' || '0' }}
        run: |
          EXTRA_ARGS="--force"
          if [ "${{ github.event.inputs.mode }}" = "render-only" ]; then
            EXTRA_ARGS="--render-only --force"
          fi
          CAT_INPUT="${{ github.event.inputs.category }}"
          if [ "$CAT_INPUT" = "all" ]; then
            node scripts/social-video-automation.mjs --separate-categories $EXTRA_ARGS
          elif [ -n "$CAT_INPUT" ]; then
            node scripts/social-video-automation.mjs --category "$CAT_INPUT" $EXTRA_ARGS
          else
            HOUR_UTC=$(date -u +%H)
            case "$HOUR_UTC" in
              06) TARGET_CAT="haberai" ;;
              08) TARGET_CAT="puanai" ;;
              10) TARGET_CAT="indirimai" ;;
              12) TARGET_CAT="finansai" ;;
              15) TARGET_CAT="evai" ;;
              17) TARGET_CAT="arabaai" ;;
              *)  TARGET_CAT="indirimai" ;;
            esac
            node scripts/social-video-automation.mjs --category "$TARGET_CAT" $EXTRA_ARGS
          fi

      - name: Upload Generated 9:16 Reels MP4, Covers & Manifest as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uretir-telegram-stock-package-${{ github.run_number }}
          path: |
            reports/social-media/**/*.mp4
            reports/social-media/**/*.png
            reports/social-media/**/*.jpg
            reports/social-media/**/*.mp3
            reports/social-media/**/publish-manifest.json
          if-no-files-found: ignore
          retention-days: 14
