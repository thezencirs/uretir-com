name: "Üretir 7/24 Veri & Sosyal Medya Otomasyonu (09:00, 12:00, 15:00, 20:00)"

on:
  schedule:
    # 09:00 Europe/Istanbul (06:00 UTC) - Sabah Gündem & Piyasa Kancası (HaberAI 81 İl + FinansAI)
    - cron: "0 6 * * *"
    # 12:00 Europe/Istanbul (09:00 UTC) - Öğle İndirim & Kart Kancası (İndirimAI Dip Fiyat + PuanAI)
    - cron: "0 9 * * *"
    # 15:00 Europe/Istanbul (12:00 UTC) - İkindi Otomobil & Konut Kancası (ArabaAI + EvAI Kamu İhale)
    - cron: "0 12 * * *"
    # 20:00 Europe/Istanbul (17:00 UTC) - Akşam Kapanış Özeti (6 AI Aracı Günün Özeti)
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Yayın kuşağı (09, 12, 15, 20 veya dyson)"
        required: false
        default: "09"
      mode:
        description: "Çalışma modu (publish: canlı yayınla, render-only: sadece MP4/kapak üret)"
        required: false
        default: "publish"

permissions:
  contents: read

concurrency:
  group: uretir-social-video-broadcast
  cancel-in-progress: false

jobs:
  uretir-broadcast:
    name: "uretir.com Veri Senkronizasyonu + Hook & Fon Video + Çok Kanallı Yayın"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Astral uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Install FFmpeg, Node dependencies & Open-Source Stack (instagrapi + edge-tts)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          pnpm install --frozen-lockfile
          mkdir -p .local/open-source-stack/repos
          if [ ! -d ".local/open-source-stack/repos/instagrapi" ]; then
            git clone --depth 1 https://github.com/subzeroid/instagrapi.git .local/open-source-stack/repos/instagrapi
          fi
          uv tool install edge-tts || true

      - name: Run Üretir Data Sync & Social Video Broadcast
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://www.uretir.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USERNAME: ${{ secrets.IG_USERNAME || 'uretirai' }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          SKIP_PUBLISH: ${{ github.event.inputs.mode == 'render-only' && '1' || '0' }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.mode }}" = "render-only" ]; then
            EXTRA_ARGS="--render-only"
          fi
          if [ "${{ github.event.inputs.slot }}" = "dyson" ]; then
            node scripts/social-video-automation.mjs --dyson-special $EXTRA_ARGS
          elif [ -n "${{ github.event.inputs.slot }}" ] && [ "${{ github.event.inputs.slot }}" != "auto" ]; then
            node scripts/social-video-automation.mjs --slot=${{ github.event.inputs.slot }} $EXTRA_ARGS
          else
            node scripts/social-video-automation.mjs $EXTRA_ARGS
          fi

      - name: Upload Generated 9:16 Reels MP4, Covers & Manifest as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uretir-social-media-package-${{ github.run_number }}
          path: |
            reports/social-media/**/*.mp4
            reports/social-media/**/*.png
            reports/social-media/**/*.jpg
            reports/social-media/**/*.mp3
            reports/social-media/**/publish-manifest.json
          if-no-files-found: ignore
          retention-days: 14
